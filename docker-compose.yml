version: "3.4"

services:
  web:
    build: .
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3310:3310"
      - "3000:3000"
    environment:
      APP_PORT: 3310
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans le fichier .env}
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans le fichier .env}
      DB_NAME: js_template_fullstack
      VITE_API_URL: ""
    command: sh -c "npm run dev"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql/mysql-server:8.0
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./database-setup.sh:/docker-entrypoint-initdb.d/setup.sh
    #      - db-data:/var/lib/mysql
    environment:
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans le fichier .env}
      # Password for root access
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD manquant dans le fichier .env}
    ports:
      - target: 3306
        published: 3307
        protocol: tcp
